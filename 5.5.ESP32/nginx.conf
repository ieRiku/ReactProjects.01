# HTTP server for somezing.me: redirect to HTTPS
server {
    listen 80;
    server_name somezing.me;
    return 301 https://$host$request_uri;
}

# HTTP server for api.somezing.me: redirect to HTTPS
server {
    listen 80;
    server_name api.somezing.me;
    return 301 https://$host$request_uri;
}

# HTTPS server block for main web app (somezing.me)
server {
    listen 443 ssl;
    server_name somezing.me;

    ssl_certificate /ssl/etc/live/somezing.me/fullchain.pem;
    ssl_certificate_key /ssl/etc/live/somezing.me/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://app:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ /.well-known/acme-challenge {
        root /var/www/certbot;
    }
}

# HTTPS server block for API (api.somezing.me)
server {
    listen 443 ssl;
    server_name api.somezing.me;

    ssl_certificate /ssl/etc/live/somezing.me/fullchain.pem;
    ssl_certificate_key /ssl/etc/live/somezing.me/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://app:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
