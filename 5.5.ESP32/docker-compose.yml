version: "3.8"
services:
  app:
    image: esp32
    build:
      context: ./esp32
      dockerfile: dockerfile
    ports:
      - "3000:3000"    # Vite app
      - "3001:3001"    # API server
    volumes:
      - ./esp32/ssl:/app/ssl
  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
