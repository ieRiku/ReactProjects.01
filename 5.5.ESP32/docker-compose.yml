version: '3.8'

services:
  app:
    build:
      context: ./esp32
      dockerfile: dockerfile
    volumes:
      - ./ssl:/app/ssl
    # ...existing configuration if any...

  certbot-init:
    image: certbot/certbot
    volumes:
      - ./ssl:/ssl
    command: certonly --webroot -w /var/www/certbot --agree-tos --no-eff-email --email atomikxp@gmail.com -d somezing.me --config-dir /ssl/etc --work-dir /ssl/var --logs-dir /ssl/logs
    # This will generate the certificate in /ssl/etc/live/somezing.me
  
  certbot:
    image: certbot/certbot
    depends_on:
      - certbot-init
    volumes:
      - ./ssl:/ssl
    entrypoint: sh -c "while :; do certbot renew --webroot -w /var/www/certbot --config-dir /ssl/etc --work-dir /ssl/var --logs-dir /ssl/logs && echo 'Renewed'; sleep 2592000; done"
    restart: unless-stopped

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - app
      - certbot
    volumes:
      - ./ssl:/ssl
      - ./nginx.conf:/etc/nginx/conf.d/default.conf  # Use custom nginx config
    restart: unless-stopped

volumes: {}
