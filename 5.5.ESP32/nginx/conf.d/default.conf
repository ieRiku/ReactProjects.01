# ...existing configuration (if any)...

server {
    listen 80;
    server_name somezing.me;
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name somezing.me;

    ssl_certificate /etc/letsencrypt/live/somezing.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/somezing.me/privkey.pem;

    location /api/ {
        proxy_pass http://app:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        proxy_pass http://app:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

